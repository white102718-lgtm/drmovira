name: adpulse-db

services:
  mongodb:
    image: mongo:8.2.1
    container_name: adpulse-mongodb
    restart: unless-stopped
    ports:
      - "${DB_PRIVATE_IP}:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: plat
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - /opt/adpulse-db/data/mongodb:/data/db
      - /opt/adpulse-db/config/mongod.conf:/etc/mongod.conf:ro
      - /opt/adpulse-db/config/mongo-init.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    command: ["mongod", "--config", "/etc/mongod.conf"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: adpulse-redis
    restart: unless-stopped
    ports:
      - "${DB_PRIVATE_IP}:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /opt/adpulse-db/data/redis:/data
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: adpulse-minio
    restart: unless-stopped
    ports:
      - "${DB_PRIVATE_IP}:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /opt/adpulse-db/data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: adpulse-minio-bootstrap
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc admin user add local "$$MINIO_APP_USER" "$$MINIO_APP_PASSWORD" || true
        mc admin policy attach local readwrite --user "$$MINIO_APP_USER"
        for bucket in materials tmp creative-origin creative-origin-img creative-generated creative-generated-img content material-commons; do
          mc mb --ignore-existing "local/$$bucket"
        done

