log_format proxy_log '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     'upstream_addr=$upstream_addr upstream_status=$upstream_status '
                     'request_time=$request_time';

server {
    listen 80;
    server_name ad-mpower.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ad-mpower.com;
    ssl_certificate /etc/letsencrypt/live/ad-mpower.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad-mpower.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10g;
    access_log /var/log/nginx/adpulse-access.log proxy_log;
    error_log /var/log/nginx/adpulse-error.log;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_vary on;

    location ~* ^/(?:js|css)/.+\.(?:css|js|mjs|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /minio/ {
        proxy_pass http://172.31.8.119:9000/;
        proxy_set_header Host 172.31.8.119:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /backend/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /main/ {
        proxy_pass http://127.0.0.1:8081/api/main/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /adpulse-api/ {
        rewrite ^/adpulse-api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / { try_files $uri $uri/ /index.html; }
}
