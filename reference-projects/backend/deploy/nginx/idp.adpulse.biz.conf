# IdP(auth-server) 独立子域,跟主站 SSL 终结分开,避免跟 ad-plat.conf 那套路径分发耦合。
# 443 直转后端机器 172.31.37.225:9100,不经过前端 5555 这一跳。

server {
    server_name idp.adpulse.biz;
    client_max_body_size 1M;

    access_log /var/log/nginx/idp-access.log;
    error_log /var/log/nginx/idp-error.log;

    location / {
        # auth-server 跑在后端机器 172.31.37.225:9100,nginx 在前端机器,不能用 127.0.0.1
        proxy_pass http://172.31.37.225:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/adpulse.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adpulse.biz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = idp.adpulse.biz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name idp.adpulse.biz;
    return 301 https://$host$request_uri;
}
