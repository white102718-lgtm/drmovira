# 添加详细日志格式
log_format proxy_log '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" '
                        'upstream_addr=$upstream_addr '
                        'upstream_status=$upstream_status '
                        'request_time=$request_time';
server {
    listen 5555;
    server_name _;  # 替换为你的域名或服务器IP

    root /home/ubuntu/soft/ad-plat/frontend/dist;  # 前端文件存放路径
    index index.html;
    client_max_body_size 500M;  # 根据需要调整大小

    # 使用详细日志格式
    access_log /var/log/nginx/ad-plat-access.log proxy_log;
    error_log /var/log/nginx/ad-plat-error.log;

    # gzip配置
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # 处理前端路由
    location / {
        try_files $uri $uri/ /index.html;  # 改为支持SPA路由
    }

    # API请求代理到3000端口
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /automationApi/ {
        rewrite ^/automationApi/(.*) /api/$1 break;
        proxy_pass http://47.131.62.227:7015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 工单素材上传（大文件最大 10G）：精确匹配单独放开包体上限与超时，关闭请求缓冲直传后端，不影响其它 backend 接口
    location = /backend/material-orders/attachments {
        rewrite ^/backend/(.*) /$1 break;

        client_max_body_size 10g;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://172.31.37.225:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /backend/ {
        # 修复路径处理 - 使用正则捕获路径部分
        rewrite ^/backend/(.*) /$1 break;

        proxy_pass http://172.31.37.225:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /aiReport/ {
        rewrite ^/aiReport/(.*) /api/$1 break;

        proxy_pass http://54.254.24.55:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ /other/ {
        # 修复路径处理 - 使用正则捕获路径部分
        rewrite ^/other/(.*) /$1 break;

        proxy_pass http://12.28.27.46:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
