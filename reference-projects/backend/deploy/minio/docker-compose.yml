services:
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /opt/pvstore/data/minio:/data
    environment:
      - MINIO_ROOT_USER=Q4mH9xLs
      - MINIO_ROOT_PASSWORD=Wn3yPq8Lr5mXz2Kc9tRv
    command: server /data --console-address ":9001"
    restart: unless-stopped