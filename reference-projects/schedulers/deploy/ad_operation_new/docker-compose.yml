services:
  ad_op_consumer:
    build:
      context: ../../
      dockerfile: deploy/ad_operation_new/Dockerfile
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-dev}
    restart: unless-stopped

  campaign_sync_consumer:
    build:
      context: ../../
      dockerfile: deploy/ad_operation_new/Dockerfile
    command: ["python", "-m", "tasks.ad_operation_new.campaign_sync_consumer"]
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-dev}
    restart: unless-stopped
