# 测试环境媒体代理，放入 test.ad-mpower.com 的 HTTPS server 块中。
# 上游连接地址按 Nginx 部署网络调整，Host 必须与后端 MINIO_ENDPOINT 一致。
# 不能走 SPA 的 index.html 回退，否则 mp4 请求会返回 HTML，浏览器无法播放。
# 已应用于 /opt/docker/frontend/adpulse/nginx.conf；修改后先 nginx -t 再热重载。
    # Signed media URLs must reach MinIO instead of the SPA fallback.
    location ^~ /minio/ {
        proxy_pass http://127.0.0.1:9000/;
        # Must match backend MINIO_ENDPOINT, which is included in the signature.
        proxy_set_header Host 172.31.23.105:9000;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
