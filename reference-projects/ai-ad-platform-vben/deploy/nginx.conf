# 添加详细日志格式
log_format proxy_log '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" '
                        'upstream_addr=$upstream_addr '
                        'upstream_status=$upstream_status '
                        'request_time=$request_time';
server {
    listen 80;
    server_name ad-mpower.com;

    # Let’s Encrypt HTTP-01 challenge and automatic HTTP-to-HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ad-mpower.com;

    ssl_certificate /etc/letsencrypt/live/ad-mpower.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad-mpower.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker 容器内的前端静态文件目录。
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 500M;  # 根据需要调整大小

    # 使用详细日志格式
    access_log /var/log/nginx/ad-plat-access.log proxy_log;
    error_log /var/log/nginx/ad-plat-error.log;

    # gzip配置
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # 处理前端路由
    # MinIO presigned media proxy, keep Host as MinIO endpoint for signature validation.
    # Backend test env should set:
    # MINIO_EXTERNAL_ENDPOINT=http://54.179.56.204:5555/minio
    location /minio/ {
        proxy_pass http://54.179.56.204:9000/;
        proxy_set_header Host 54.179.56.204:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 自动化规则、KPI 预警及广告数据统一由 backend_new 提供。
    location ^~ /adpulse-api/ {
        proxy_pass http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;  # 改为支持SPA路由
    }

    # API请求代理到3000端口
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /backend/ {
        # 修复路径处理 - 使用正则捕获路径部分
        rewrite ^/backend/(.*) /$1 break;

        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /automationApi/ {
        rewrite ^/automationApi/(.*) /api/$1 break;

        proxy_pass http://localhost:7015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ /aiReport/ {
        rewrite ^/aiReport/(.*) /api/$1 break;

        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ /other/ {
        # 修复路径处理 - 使用正则捕获路径部分
        rewrite ^/other/(.*) /$1 break;

        proxy_pass http://12.28.27.46:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
