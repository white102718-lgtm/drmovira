server {
    server_name adpulse.biz www.adpulse.biz a-d-loop.com www.a-d-loop.com;
    client_max_body_size 500M;  # 根据需要调整大小

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /af_port/ {
        proxy_pass http://172.31.37.225:8961/appsflyer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /callback/ {
        proxy_pass http://172.31.37.225:8961/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # MinIO 图片代理（新增）
    location /minio/ {
        proxy_pass http://18.139.123.178:9000/;
        # 关键：保留原始 MinIO 的 Host，确保签名验证通过
        proxy_set_header Host 18.139.123.178:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持大文件
        client_max_body_size 100M;
        proxy_buffering off;

        # 超时设置
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/a-d-loop.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/a-d-loop.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {


    listen 80;
    server_name adpulse.biz www.adpulse.biz a-d-loop.com www.a-d-loop.com;
    return 301 https://$host$request_uri;


}
