
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  gzip on;
  # gzip_buffers 32 16k;
  gzip_comp_level 6;
  gzip_min_length 1k;
  gzip_static on;
  gzip_types text/plain text/css application/javascript application/json text/javascript;
  gzip_vary on;
  # gzip_types text/plain
  #   text/css
  #   application/javascript
  #   application/json
  #   application/x-javascript
  #   text/xml
  #   application/xml
  #   application/xml+rss
  #   text/javascript; #设置压缩的文件类型
  # gzip_vary on;

  server {
    listen 8080;
    server_name localhost;
    client_max_body_size 500m;

    # 站内通知 SSE 必须关闭代理缓冲与压缩，确保事件立即刷新到浏览器。
    location = /backend/asset-flow-v2/notifications/stream {
      proxy_pass http://44.228.249.36:8080/api/asset-flow-v2/notifications/stream;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 30s;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      add_header X-Accel-Buffering no always;
    }

    # 用户、角色、菜单和登录由远端 AdPulse System Server 提供。
    location /backend/ {
      proxy_pass http://44.228.249.36:8080/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_connect_timeout 30s;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    # 项目接口由远端 AdPulse Main Server 提供，与开发环境代理规则保持一致。
    location ^~ /backend/project {
      proxy_pass http://44.228.249.36:8081/api/main/project;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 30s;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    location /adgen-api/ {
      proxy_pass http://adpower-backend:7001/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_connect_timeout 30s;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    location ~* \.(?:css|js|mjs)$ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 自动化规则、KPI 预警及广告数据统一由 backend_new 提供。
    location ^~ /adpulse-api/ {
      proxy_pass http://44.228.249.36:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 30s;
      proxy_read_timeout 600s;
    }

    # The HTML entrypoint references hash-named assets. It must be revalidated
    # after each deployment; otherwise a browser can retain a prior entrypoint
    # and keep loading a complete, but obsolete, JavaScript bundle.
    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      # Enable CORS
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
      }
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
