spring:
  application:
    name: adpulse-system-server
  jackson:
    time-zone: Asia/Shanghai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
  data:
    redis:
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.adpulse.system
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 10

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /api

spring.lifecycle.timeout-per-shutdown-phase: 30s

adpulse:
  file:
    root-directory: ${FILE_STORAGE_ROOT:./data/files}
    max-size: 100MB
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: adpulse-system-server
    session-ttl: 12h
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY}
      issuer: AdPulse
      challenge-ttl: 5m
      max-attempts: 5
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    phone: ${BOOTSTRAP_ADMIN_PHONE:13800000000}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}

logging:
  file:
    name: ${APP_LOG_FILE:logs/adpulse-system-server.log}
  level:
    com.adpulse.system: info
