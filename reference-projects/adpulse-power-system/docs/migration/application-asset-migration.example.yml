# 示例文件不自动加载。复制到服务器配置目录后，通过 spring.config.additional-location 加载。
adpulse:
  asset-migration:
    enabled: ${ASSET_MIGRATION_ENABLED:false}
    source-url: ${ASSET_MIGRATION_SOURCE_URL:}
    source-username: ${ASSET_MIGRATION_SOURCE_USERNAME:}
    source-password: ${ASSET_MIGRATION_SOURCE_PASSWORD:}
    source-uuid: 668439ab-d5b1-11f0-a11e-5635bb0443e0
    source-schema: fbad-suger
    # 必须显式指定 TEST/PRODUCTION 和对应实例 UUID；不再默认生产。
    target-environment: ${ASSET_MIGRATION_TARGET_ENVIRONMENT:}
    target-uuid: ${ASSET_MIGRATION_TARGET_UUID:}
    target-schema: adpulse_system
    mapping-cache-enabled: ${ASSET_MIGRATION_MAPPING_CACHE_ENABLED:true}
    # 真实 sys_user.id，多人用逗号分隔；默认 0 不具备操作权限。
    operator-ids: ${ASSET_MIGRATION_OPERATOR_IDS:0}
